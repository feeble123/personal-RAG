# ============================================================
# 单元 K · 单元③：CI（GitHub Actions）
#
# ⚠️ 重要：本 workflow 需 push 到远程（GitHub）才会触发，本机不跑。
#     当前项目遵守「不 push 远程」的规矩，此文件写好备用——将来你决定
#      push 到远程后，每次 push/PR 会自动跑一遍下面的检查，坏了立刻知道。
#
# 覆盖：后端 pytest（全离线，无需真实服务）+ 前端 lint/vitest/build。
# 前后端互不依赖，拆成两个 job 并行跑，更快。
# ============================================================

name: CI

on:
  push:
    branches: [main, feature/rag-optimization]
  pull_request:
    branches: [main]

# 并发：同一分支的新 push 会取消旧的还在跑的 run，省 CI 分钟数
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 后端测试 ----------------
  backend-test:
    name: 后端 pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12（与容器一致，3.10 于 2026-10 停维护）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖（官方 PyPI：GitHub 海外 runner 访问国内镜像会超时）
        run: pip install -r requirements.txt

      - name: 安装系统依赖（onnxruntime 需要 libgomp1，与 Dockerfile 一致）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: 运行 pytest（全离线：fake embedding/LLM、临时 SQLite/Chroma）
        run: pytest -q

      # PG 集成测试将来单独开 job（需 postgres 服务容器 + RUN_PG_TESTS=1），
      # 见 docs/P2-PG-MIGRATION.md。默认离线测试不依赖真实 PG。

  # ---------------- 前端检查 ----------------
  frontend-check:
    name: 前端 lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20（与容器阶段1 node:20-alpine 一致）
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖（官方 npm：海外 runner 访问国内镜像会超时）
        # 1) 删掉 .npmrc：里面 script-shell 指向本机 Windows 的 Git Bash 路径，Linux runner 上不存在 → exit 254
        # 2) lockfile 里 579 个包 resolved 指向 registry.npmmirror.com（国内镜像），替换回官方 npmjs
        # 3) 本机开发不受影响：本机仍用阿里镜像装包，CI 的替换只发生在云端的临时环境
        run: |
          rm -f .npmrc
          sed -i 's#registry.npmmirror.com#registry.npmjs.org#g' package-lock.json
          npm ci

      - name: ESLint（零告警红线）
        run: npm run lint

      - name: Vitest 单测
        run: npm run test

      - name: 类型检查 + 构建（tsc -b && vite build）
        run: npm run build

  # ---------------- （可选）Docker 镜像构建 ----------------
  # 默认关闭：验证 Dockerfile 是否正确需要完整 build（耗时较长）。将来要验证
  # 镜像可构建时，把下面的 `if: false` 去掉即可。注意 build context 是项目根，
  # .dockerignore 已排除 .env/data/node_modules 等。
  docker-build:
    name: Docker 镜像构建（默认关闭）
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（不推送，仅验证可构建）
        run: docker build -f deploy/Dockerfile -t rag-system:ci .
