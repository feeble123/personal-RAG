[pytest]
asyncio_mode = auto
# session 级 async fixture（client/lifespan）与测试共享同一个 event loop：
# 否则 worker task 绑 session loop，测试跑 function loop，跨 loop 用 async session 会 MissingGreenlet
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
