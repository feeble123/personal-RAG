# ============================================================
# 空白图谱库（TBox）
# ------------------------------------------------------------
# 只保留最基本的「参数」类型，其余按需要在「本体管理」里加。
# 具体取值不是本体，是数据（实例），不要写在这里。
# ============================================================
version: 1
profile_id: gate_dispatch
display_name: 水闸调度本体
description:
domain: generic

entity_types:
  - name: gate
    display_name: 水闸
    uid_prefix: gt
    scope: local
    attributes:
      - name: design_flow
        type: number
        required: true
      - name: gate_type
        type: enum
        values:
          - 平板闸
          - 弧形闸
          - 人字闸
        required: true
      - name: open_height_m
        type: number
      - name: note
        type: text
      - name: col_1
        type: string
        values:
          - 溪口闸
          - 石门闸
        description: 名称
      - name: col_2
        type: string
        values:
          - '2024-06-01'
          - '2024-06-02'
        description: 巡查日期
      - name: col_3
        type: string
        values:
          - 张三
          - 李四
        description: 巡查人
      - name: col_4
        type: enum
        values:
          - 正常
          - 异常
        description: 闸门状态
      - name: col_5
        type: number
        description: 水位m
      - name: col_6
        type: text
        values:
          - 无
          - 启闭机异响
        description: 发现问题
      - name: col_7
        type: text
        values:
          - 报修
        description: 处理意见
  - name: river_section
    display_name: 河道断面
    uid_prefix: rs
    scope: global
  - name: manage_station
    display_name: 管理所
    uid_prefix: ms
    scope: local
relation_types:
  - name: LOCATED_IN
    display_name: 位于
    source: gate
    target: river_section
  - name: RESPONSIBLE
    display_name: 管辖
    source: manage_station
    target: gate
  - name: UPSTREAM_OF
    display_name: 上游接
    source: river_section
    target: river_section
