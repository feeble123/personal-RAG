# ============================================================
# 水库防汛处置本体（TBox）
# ------------------------------------------------------------
# 描述「一场洪水来了，这座水库按什么条件、做什么动作、由谁做、依据哪一条」。
# 素材：高洞子水库的四份专题报告（调度规程 / 汛期调度运用计划 / 防洪抢险应急预案 /
# 大坝安全管理应急预案）。四份文件互相补充，也互相打架的地方，靠实例的出处区分。
#
# 与 flood_chain.yaml 的区别：
#   flood_chain   = 「下游哪些乡镇要预警、归谁管」——空间链
#   reservoir_flood = 「什么工况 → 什么调度动作 → 谁执行 → 依据哪条」——处置链
# 两套模型不要混用一个库，否则同一个「20年一遇」会拉出两条不相干的链路。
#
# 关系上的 `phase` 是给链路编排用的：说明这条关系在「人讲一件事」的顺序里属于哪一档。
# 不写就回落到引擎内置的关系名→档位表（内置表只认历史那 22 个关系名）。
# ============================================================
version: 1
profile_id: reservoir_flood
display_name: 水库防汛处置本体
description: 工况 → 调度方案 → 响应等级 → 处置措施 → 责任单位 → 影响区域，每一步挂原文出处。
domain: flood_control

entity_types:
  - name: engineering_object
    display_name: 工程对象
    uid_prefix: eo
    scope: local
    attributes:
      - {name: category, type: string, description: "水库 / 大坝 / 溢洪道 / 闸门 / 放水管"}
      - {name: grade, type: string, description: "工程等别，如 Ⅲ等中型"}
      - {name: total_storage_wan_m3, type: number, description: "总库容（万m³）"}
      - {name: max_dam_height_m, type: number, description: "最大坝高（m）"}
      - {name: dam_type, type: string, description: "坝型"}

  - name: water_level
    display_name: 特征水位
    uid_prefix: wl
    scope: global
    attributes:
      - {name: elevation_m, type: number, description: "高程（m）"}
      - {name: kind, type: enum, values: [校核洪水位, 设计洪水位, 正常蓄水位, 死水位, 汛期试运行水位, 旱警水位], description: "水位性质"}
      - {name: storage_wan_m3, type: number, description: "相应库容（万m³）"}
      - {name: note, type: string, description: "适用条件，如「正常年 / 干旱年」"}

  - name: condition
    display_name: 工况
    uid_prefix: cd
    scope: local
    attributes:
      # 简称：区间工况在文档里叫「20 年以上 50 年以下一遇」，读起来太长，
      # 存个短名叫「20~50年一遇」。只用于展示，不参与匹配。
      - {name: display_zh, type: string, description: "简称，如「20~50年一遇」"}
      # 频率用超越概率存（20 年一遇 → 0.05），重现期另存一份，两种写法都能匹配
      - {name: frequency, type: number, description: "超越概率（0.05 = 20 年一遇）"}
      - {name: return_period, type: number, description: "重现期（年）"}
      # 区间工况（「20~50 年一遇」这种）：用户只会说「50 年一遇」，
      # 引擎拿问题的重现期落在 [low, high] 里就算命中。属性名是引擎约定，
      # 不是领域词——任何本体只要声明这两个属性，就能被工况检索认出来。
      - {name: return_period_low, type: number, description: "区间下界（年一遇）"}
      - {name: return_period_high, type: number, description: "区间上界（年一遇）"}
      - {name: rainfall_24h_mm, type: string, description: "24h 降雨量区间（mm）"}
      # 上面那条是**给人看**的区间写法（"85~100"），下面两条才是引擎拿去比的数值界。
      # 原文每一档都是「大于 85mm 且小于 100mm」，所以是左开右闭：85 属于上一档、
      # 100 属于这一档。只有单边的档（「小于 85mm」）缺什么界就不声明什么界。
      - {name: rain_low_mm, type: number, description: "24h 降雨区间下界（mm，不含）"}
      - {name: rain_high_mm, type: number, description: "24h 降雨区间上界（mm，含）"}
      - {name: rainfall_6h_mm, type: string, description: "6h 降雨量阈值（mm）"}
      # compare: gt —— 这是个**阈值**，不是"等于"。工况名写的是「库水位超过正常蓄水位」，
      # 属性值是 343.0；问「库水位 343.2m」时要按"过没过这条线"判，按相等判就对不上。
      - {name: level_m, type: number, compare: gt, description: "库水位阈值（m）"}
      # 和上面的 `level_m` 语义不同：那个是"超过某条线就算"，这个是"这一档对应哪条线"。
      # 调度规程每个方案的前置条件都是「当雨前库水位达到 338.5m（正常年）/ 340.00m
      # （干旱年），且预计 24h 降雨量…的情况下」——起调水位属于**工况**，不属于方案：
      # 同一个方案（控泄 60m³/s）两套年型都用，只有起调水位不同。挂在方案上就会
      # 只剩一个值（CQ-07），挂在工况上才说得清。
      - {name: start_level_m, type: number, description: "雨前库水位（m）"}
      - {name: inflow_m3s, type: number, description: "入库流量（m³/s）"}
      - {name: season, type: string, description: "来水年型"}
      - {name: note, type: string, description: "补充说明"}

  - name: dispatch_plan
    display_name: 调度方案
    uid_prefix: dp
    scope: local
    attributes:
      - {name: outflow_m3s, type: number, description: "控制下泄流量（m³/s）"}
      # 起调水位**不建在方案上**：同一个方案（如「1~2年一遇控泄方案」60m³/s）
      # 正常年（338.5m）和干旱年（340m）都在用，挂在方案上只能留一个值，
      # 干旱年就答成 338.5（CQ-07 实测）。真正的归属是 `condition.start_level_m`。
      - {name: start_level_m, type: number, description: "起调水位（m）。归属工况（condition.start_level_m），方案上不再存"}
      - {name: target_level_m, type: number, description: "维持目标水位（m）"}
      - {name: gate_opening_m, type: number, description: "闸门开度（m）"}
      - {name: mode, type: enum, values: [控泄, 全开泄洪, 保坝, 不泄], description: "调度方式"}
      - {name: priority, type: string, description: "保护对象"}
      # 引擎约定：同一工况下出现多条同类方案时，按这个值取高者（数字大 = 优先）。
      # 值是人根据文件效力定的，不是原文事实——所以写在 note 里说明依据，别当数字证据。
      - {name: authority_rank, type: number, description: "依据文件的权威级（同工况冲突时取高者）"}
      - {name: note, type: string, description: "补充说明"}

  - name: response_level
    display_name: 响应等级
    uid_prefix: rl
    scope: global
    attributes:
      - {name: level, type: enum, values: [Ⅰ, Ⅱ, Ⅲ, Ⅳ], description: "响应级别"}
      - {name: color, type: string, description: "预警颜色"}
      - {name: trigger_summary, type: string, description: "启动条件摘要"}
      # 预案对每一级都是「发生Ⅹ级险情后的处置措施：（1）（2）…」逐条列出的，
      # 条数本身是原文事实，所以存成实例属性；TBox 的约束拿它当漏建检查的下限。
      - {name: expected_measures, type: number, description: "预案该级列出的处置措施条数"}

  - name: measure
    display_name: 处置措施
    uid_prefix: ms
    scope: local
    attributes:
      # timing / frequency 是**随响应等级变**的（传达命令在Ⅱ级是 30min、Ⅳ级是 1h），
      # 所以实际值挂在 response_level → measure 的边上，节点上只在四级相同时才写。
      - {name: timing, type: string, description: "时限"}
      - {name: owner_role, type: string, description: "执行角色"}
      - {name: frequency, type: string, description: "频次"}
      - {name: note, type: string, description: "补充说明"}

  - name: management_unit
    display_name: 责任单位
    uid_prefix: mu
    scope: local
    attributes:
      - {name: role, type: string, description: "在防汛体系中的角色"}
      - {name: note, type: string, description: "补充说明"}

  - name: admin_region
    display_name: 影响区域
    uid_prefix: ar
    scope: global
    attributes:
      - {name: level, type: enum, values: [镇, 街道, 村, 区], description: "行政区级别"}
      - {name: flood_standard, type: string, description: "现状防洪标准"}

  - name: standard_clause
    display_name: 依据条款
    uid_prefix: cl
    scope: global
    attributes:
      - {name: doc, type: string, description: "文件名"}
      - {name: clause_no, type: string, description: "条款号，如 3.3.1.1"}

  # 预案对每一级响应都点名了「谁启动」——「领导小组副组长城南公司董事长蒋捷
  # 启动IV级应急响应」。这是**具体的人**，不是单位，用 management_unit 装不下
  # （一问"启动人是谁"，答"高洞子水库管理处"是错的）。
  - name: person
    display_name: 人员
    uid_prefix: ps
    scope: local
    attributes:
      # 职务照抄原文，不改写：同一个人的头衔在四级里写法不同（副组长/组长），
      # 而职称（城南公司董事长 / 水利局局长 / 副区长）是区分同名同姓的依据。
      - {name: title, type: string, description: "职务"}
      - {name: org, type: string, description: "所在单位"}
      - {name: note, type: string, description: "补充说明"}

# ------------------------------------------------------------
# 关系
# phase 取值：basis（工况与依据）/ flow（流程推进）/ actor（谁处置）
#            / means（用什么）/ impact（影响谁）/ response（怎么应对）
# ------------------------------------------------------------
relation_types:
  # 工况 → 方案：这是最核心的一条，「20 年一遇」靠它落到「控泄多少」。
  # phase 是 response 不是 basis：它讲的是**该做什么**，不是"凭什么这么判"。
  # 早先挂成 basis，答案里就出现两段并排的「工况与依据」——一段是调度方案、
  # 一段是等级判据，读起来像两份文档拼在一起（实测）。
  - {name: STIPULATES, display_name: 规定, phase: response,
     source: condition, target: dispatch_plan,
     description: "该工况下按此方案调度"}

  # 工况 → 工况：粗说法落在细档位里。
  # 四份文件里「20 年一遇」有好几种写法（预警条件、下游标准、调度分档），
  # 靠这条把「20年一遇洪水」接到「10~20年一遇降雨（155~170mm）」那一档，
  # 链路才能从一句问题走到具体的控泄流量。
  # subsumption: true → 检索层把这条关系当**继承**用：
  # 问「20年一遇洪水」时，它所属的「10~20年一遇降雨」身上的调度方案一并算作它的，
  # 结果与遍历深度上限无关。不标的话它就只是一条普通边，不传递也不继承。
  - {name: INSTANCE_OF, display_name: 属于档位, phase: basis,
     source: condition, target: condition, subsumption: true,
     description: "粗工况属于哪个细分工况档位"}

  # 工况 → 响应等级：触发哪一级应急响应
  - {name: TRIGGERS, display_name: 触发, phase: basis,
     source: condition, target: response_level,
     description: "该工况触发对应级别的应急响应"}

  # 等级 → 措施：这一级响应当做什么
  - {name: RESPONDS_WITH, display_name: 启动, phase: response,
     source: response_level, target: measure,
     description: "该级响应的处置动作"}

  # 方案 → 措施：为落实调度方案要做的动作（通知、开闸、巡查…）
  - {name: REQUIRES, display_name: 需要, phase: basis,
     source: dispatch_plan, target: measure,
     description: "执行该方案必须完成的动作"}

  # 措施之间：先做什么后做什么
  - {name: NEXT_STEP, display_name: 之后, phase: flow,
     source: measure, target: measure,
     description: "处置动作的先后顺序"}

  # 措施 → 责任单位
  - {name: PERFORMED_BY, display_name: 由…执行, phase: actor,
     source: measure, target: management_unit,
     description: "谁负责执行这个动作"}

  # 责任单位 → 上级/指挥关系
  - {name: REPORTS_TO, display_name: 报告, phase: actor,
     source: management_unit, target: management_unit,
     description: "信息与指令的上报/指挥关系"}

  # 行政区 → 属地责任单位：谁管这片地。
  # 为什么需要：转移、安置、转移后的警戒都是镇街政府在干，而本体原来只有
  # 「行政区」（受影响对象）没有「属地政府」（执行者），于是「组织人员转移」
  # 找不到执行单位——它的执行者是镇街的镇长/主任，不是水库管理处。
  # **数量随实际下游镇街走**：这一条加进 TBox，下游 4 个镇就建 4 个、
  # 换一座水库下游 7 个就建 7 个，引擎不需要改一行。
  - {name: GOVERNED_BY, display_name: 由…管辖, phase: actor,
     source: admin_region, target: management_unit,
     description: "这片行政区的属地责任单位（镇人民政府 / 街道办事处）"}

  # 措施 → 影响区域（谁需要被通知/转移）
  - {name: AFFECTS, display_name: 影响, phase: impact,
     source: measure, target: admin_region,
     description: "该动作影响到的下游行政区"}

  # 措施/方案 → 依据条款。
  # source_types 是"除 source 之外还允许的主语"：依据既可能挂在**动作**上，
  # 也可能挂在**方案**上（「1~2年一遇控泄方案」依据「调度规程 3.3.1.1」）。
  # 没有它就只能拆成两个关系名，换本体时越拆越乱。
  - {name: CONSTRAINED_BY, display_name: 依据, phase: basis,
     source: measure, source_types: [dispatch_plan], target: standard_clause,
     description: "这条动作/方案出自哪份文件的哪一条"}

  # 工况 → 调度权限单位：这个局面下**谁有权**下达调度指令。
  # 和 PERFORMED_BY 不是一回事——前者是"谁说了算"，后者是"谁动手做"。
  # 早先这两条被混用成 PERFORMED_BY（condition → management_unit），
  # 端点校验一开就暴露了：工况不会"执行"任何动作。
  - {name: DISPATCHED_BY, display_name: 调度权限归, phase: actor,
     source: condition, target: management_unit,
     description: "该工况下的调度指令由谁下达"}

  # 和 RESPONDS_WITH（等级 → 启动哪些措施）不是一回事：这条是「谁按下了启动键」。
  # 方向按原文语序：原文写「蒋捷启动IV级应急响应」，主语是人。
  - {name: STARTS, display_name: 启动, phase: actor,
     source: person, target: response_level,
     description: "这个人启动该级应急响应"}

  # 措施 → 工程对象（开哪扇闸、用哪个泄水设施）
  - {name: USES_FACILITY, display_name: 使用设施, phase: means,
     source: measure, target: engineering_object,
     description: "执行时动用的工程设施"}

  # 措施 → 保护对象
  - {name: PROTECTS, display_name: 保护, phase: response,
     source: measure, target: admin_region,
     description: "该措施保护的下游对象"}

# ------------------------------------------------------------
# 约束（TBox 里声明「这套本体应该长什么样」，建库时对实例求值）
# 每一条都必须能追溯到 docs/本体能力问题清单.md 里的 CQ；
# 没有能力问题支撑的约束一律不加，否则约束会变成没人敢改的"感觉"。
# ------------------------------------------------------------
constraints:
  # CQ-10：给定响应等级，能列出**全部**处置措施、一条不漏。
  # 逐条核对而不是数条数：实例写「原文这一级共 expected_measures 条」，
  # 每条边写「我对应原文第 source_item 条」，要求 1..N 每一条都有人认领。
  # 为什么不用 min_count：数条数分不清"拆分"和"漏建"——实测Ⅳ级原文 5 条、
  # 本体连了 6 条看着达标，其实把第 (4) 条拆成两个节点凑数，第 (2) 条整条漏掉。
  - id: response_level.measures_coverage
    type: coverage
    entity: response_level
    relation: RESPONDS_WITH
    target_type: measure
    total_attr: expected_measures
    item_attr: source_item
    severity: error
    cq: CQ-10
    message: "预案该级的处置措施没有逐条建全"

  # CQ-05：边界值与归属必须唯一，一个工况不能触发两个等级。
  - id: condition.single_response_level
    type: max_count
    entity: condition
    relation: TRIGGERS
    target_type: response_level
    max: 1
    severity: error
    cq: CQ-05
    message: "同一工况触发了多个响应等级，归属不唯一"

  - id: response_level.unique_level
    type: unique_attribute
    entity: response_level
    attribute: level
    severity: error
    cq: CQ-05
    message: "响应级别重复定义"

  # CQ-06：方案必须能被某个工况触发到，否则永远用不上。
  - id: dispatch_plan.reachable
    type: min_count
    entity: dispatch_plan
    relation: STIPULATES
    direction: in
    min: 1
    severity: warning
    cq: CQ-06
    message: "没有任何工况指向这个调度方案，它永远触发不到"

  # CQ-01：工况既不给方案也不触发等级，就是死数据。
  - id: condition.actionable
    type: min_count
    entity: condition
    relation: [STIPULATES, TRIGGERS, INSTANCE_OF]
    min: 1
    severity: warning
    cq: CQ-01
    message: "工况既不给调度方案也不触发响应等级，是死数据"

  # CQ-25：同一工况下不该有多条互相打架的方案并存而不被指出。
  # 这一条**故意设成 warning**：四份报告本来就会打架（5~10 年一遇控泄，
  # 调度规程写 120、汛期调度运用计划写 125）。冲突不是错误，是必须被摆到台面上
  # 再按权威级仲裁的事实。查出来是提醒人去确认，不是拦住建库。
  - id: condition.conflicting_plans
    type: max_count
    entity: condition
    relation: STIPULATES
    target_type: dispatch_plan
    max: 1
    severity: warning
    cq: CQ-25
    message: "同一工况下有多条调度方案，需要按权威级仲裁"

  # CQ-11：每条措施都要能说出由谁执行。
  - id: measure.executor
    type: min_count
    entity: measure
    relation: PERFORMED_BY
    min: 1
    severity: warning
    cq: CQ-11
    message: "措施没有挂执行单位"

# ------------------------------------------------------------
# 规则（TBox 里声明「多少年一遇归哪一级」，检索时对问题工况求值）
#
# 这是本体相对 GraphRAG 的实质差别：GraphRAG 只能给你文档里**出现过的**关系，
# 规则能给你**按定义必然成立**的关系。20/50/100/300/1000 年一遇全部自动归位，
# 一条边都不用手工连；新增一档工况只加一条规则，引擎一行不动。
#
# 边界口径：左开右闭（与 conditions.py 的区间匹配一致）。
# 已知原文冲突：预案 4.6.1.2 写「1000 年以下」、4.6.1.4 写「1000 年以上」，
# 1000 年一遇两边都算得进。这里取 Ⅱ 级（沿用既有行为），
# 显式留给 ⑥ 冲突仲裁去处理，而不是假装没有这回事。
# ------------------------------------------------------------
rules:
  - id: response_level.by_return_period.Ⅳ
    type: classify
    key: return_period
    when: {lte: 20}
    emit:
      relation: TRIGGERS
      target_type: response_level
      target_match: {level: Ⅳ}
    cq: CQ-01
    message: "重现期 ≤ 20 年 → Ⅳ级响应（蓝色）"

  - id: response_level.by_return_period.Ⅲ
    type: classify
    key: return_period
    when: {gt: 20, lte: 50}
    emit:
      relation: TRIGGERS
      target_type: response_level
      target_match: {level: Ⅲ}
    cq: CQ-01
    message: "重现期 (20, 50] 年 → Ⅲ级响应（黄色）"

  - id: response_level.by_return_period.Ⅱ
    type: classify
    key: return_period
    when: {gt: 50, lte: 1000}
    emit:
      relation: TRIGGERS
      target_type: response_level
      target_match: {level: Ⅱ}
    cq: CQ-01
    message: "重现期 (50, 1000] 年 → Ⅱ级响应（橙色）"

  - id: response_level.by_return_period.Ⅰ
    type: classify
    key: return_period
    when: {gt: 1000}
    emit:
      relation: TRIGGERS
      target_type: response_level
      target_match: {level: Ⅰ}
    cq: CQ-01
    message: "重现期 > 1000 年 → Ⅰ级响应（红色）"
