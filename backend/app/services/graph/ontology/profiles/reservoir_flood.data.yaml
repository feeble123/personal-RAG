# 为什么建这一批：原文里「群众转移、财产撤离的负责人员为所在镇街的镇长、
# 街道办事处主任」——执行者是镇街政府，不是水库管理处。原来本体只有
# 「行政区」（受影响对象），没有「属地政府」（执行者），这条措施就挂不上人。
# **下游有几个镇街就建几个**：高洞子下游 5 个，但原文只对 4 个给了联系人，
# 鱼洞街道没有（原文只把它列为下游防护对象），所以这里只建 4 个，不凑数。
# 换一座水库，这一节随实际资料增减，TBox 不动。
# ============================================================
