# =========================================================
# 单元 K · 单元②：Nginx 反向代理（对外唯一入口）
#
# 拓扑：客户端 ──> nginx(:80) ──> backend(uvicorn:8000)
# 前端静态资源(SPA)、/api、/metrics 均由后端托管（app/main.py 已挂 SPA fallback），
# nginx 只做统一入口 + gzip + SSE 关缓冲。
# =========================================================

server {
    listen 80;
    server_name _;    # 改成你的域名或服务器 IP

    charset utf-8;

    # gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # 带 hash 的静态资源长缓存（后端 StaticFiles 自带 cache，这里再兜一层）
    location /assets/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API / 其余一切：反代到后端 ----
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式响应必须关闭缓冲（问答是流式输出，开了会卡住）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
